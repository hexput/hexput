[workspace]
# Resolver 3 is the edition-2024 default and is MSRV-aware, which pairs with the
# toolchain pinned in rust-toolchain.toml. A virtual manifest must state it explicitly.
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false
# Resolver 3's MSRV-aware resolution only does anything when rust-version is set;
# without this the resolver choice above is inert. Kept in step with rust-toolchain.toml.
rust-version = "1.98.1"

# NFR2's memory-safety property. Declared once here and inherited by every member via
# `[lints] workspace = true`, so a crate added later cannot silently miss it. The four
# crates NFR2 names specifically (lexer, parser, interpreter, exec) additionally carry
# `#![forbid(...)]`, which an inner `#[allow]` cannot override.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Pinned once here and inherited; no member ever re-pins a version. `clap` parses every CLI's
# arguments — the `hexput` eval/check commands and the daemon's own `--config` (AD-7) — so one
# parser and one usage style serve all of them. The Spine's Stack table records it too.
clap = { version = "4.6.7", features = ["derive"] }
tokio = "1.53.1"
tokio-tungstenite = "0.30.0"
rustls = "0.23.45"
serde = "1.0.229"
rmp-serde = "1.3.1"
dashmap = "6.2.1"
moka = "0.12.16"
criterion = "0.8.2"
tracing = "0.1.44"
indexmap = "2.14.2"
