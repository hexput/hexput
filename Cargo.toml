[workspace]
# Resolver 3 is the edition-2024 default and is MSRV-aware, which pairs with the
# toolchain pinned in rust-toolchain.toml. A virtual manifest must state it explicitly.
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false
# Resolver 3's MSRV-aware resolution only does anything when rust-version is set;
# without this the resolver choice above is inert. Kept in step with rust-toolchain.toml.
rust-version = "1.98.1"

# NFR2's memory-safety property. Declared once here and inherited by every member via
# `[lints] workspace = true`, so a crate added later cannot silently miss it. The four
# crates NFR2 names specifically (lexer, parser, interpreter, exec) additionally carry
# `#![forbid(...)]`, which an inner `#[allow]` cannot override.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Pinned once here and inherited; no member ever re-pins a version. `clap` parses every CLI's
# arguments — the `hexput` eval/check commands and the daemon's own `--config` (AD-7) — so one
# parser and one usage style serve all of them. The Spine's Stack table records it too.
#
# Feature sets are hoisted here with the version (Story 2.1): a member writes `workspace = true`
# and nothing else, so two crates can never diverge on what a dependency provides. A feature is
# added here, in the one place, when its first consumer needs it.
clap = { version = "4.6.7", features = ["derive"] }
# `rt-multi-thread` for the daemon's runtime, `signal` for its SIGINT/SIGTERM (Ctrl-C) shutdown.
# Story 2.3: `net` + `io-util` for the Unix Domain Socket adapter, `macros` for the accept loop's
# `select!`, `time` for its back-off after a failed accept, and `sync` for a test's shutdown
# channel — one feature set, so the tests exercise the same tokio the daemon runs on.
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "signal",
    "net",
    "io-util",
    "macros",
    "time",
    "sync",
] }
tokio-tungstenite = "0.30.0"
# Story 5.1: TLS for the TCP adapter. The `ring` provider rather than rustls's default `aws-lc-rs`:
# a much smaller build (no cmake, no large C library) and no FIPS ambition. `std` for the PEM
# loader and the `ServerConfig`, `tls12` so TLS 1.2 clients are served alongside TLS 1.3.
# Resolved at exactly 0.23.45 (`cargo update -p rustls --precise 0.23.45`); `aws-lc-rs` must
# never appear in `Cargo.lock`.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# Story 5.1: rustls over tokio's `AsyncRead`/`AsyncWrite`, with the same provider and versions.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
# System Config's file format (Story 2.1). Parsing only: `display` (the serializer) is left out
# because `hexput-config` exposes no write API.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
rmp-serde = "1.3.1"
# The Port's untyped payload value (Story 2.2): a frame decodes to `rmpv::Value` first, is validated
# as an envelope by hand, and later stories convert payloads to typed structs through
# `rmpv::ext::from_value` — which is what `with-serde` provides.
rmpv = { version = "1.3.1", features = ["with-serde"] }
dashmap = "6.2.1"
# The OS CSPRNG (Story 2.4): Client IDs are 128 unguessable bits. OQ-2's reconnect secret will
# draw from the same source. `fill` needs no feature.
getrandom = "0.4.3"
# The AST Cache (Story 4.1): `sync::Cache` keyed by `(Client ID, Script handle)`.
moka = { version = "0.12.16", features = ["sync"] }
# Story 4.4's `cache` bench in `hexput-tests`. `cargo_bench_support` alone: no `plotters`,
# `rayon` or `html_reports` — the figures are read from the terminal and the bench's own JSON
# report, and the plotting stack is heavy to build.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Story 4.5's comparator in the same `cache` bench: the same rule on Rhai, over the same UDS
# framing and in-process. `hexput-tests` takes it as a dev-dependency only, so no production crate
# can reach it (the graph check's normal-dependency rules never see it). Default features, as a
# Rhai user would embed it; 1.26.1 is the latest release out for more than a month.
rhai = "1.26.1"
tracing = "0.1.44"
# The daemon's log output (Story 2.1): `fmt` lines filtered at System Config's `log_level`.
# Story 2.8 adds `json`, System Config's `log_format = "json"`: one JSON object per event, span
# fields included.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "json"] }
indexmap = "2.14.2"
# Story 2.8: the daemon tests parse `log_format = "json"` output line by line. Already in the
# graph through `tracing-subscriber`'s `json` feature; no production crate depends on it directly.
serde_json = "1.0.151"
