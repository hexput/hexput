# Hexput System Config — the Daemon's own operational settings.
#
# This file configures the Daemon, never a Backend: a Backend's per-backend Config arrives
# inline over the socket and is never read from disk.
#
# Where the Daemon looks for this file, first match wins and there is no fallthrough:
#   1. hexput-daemon --config <path>
#   2. the HEXPUT_CONFIG environment variable
#   3. /etc/hexput/config.toml on Unix, %ProgramData%\hexput\config.toml on Windows
#
# The file is read once, at startup; restart the Daemon to apply a change. Unknown keys are an
# error, so a misspelled key is reported rather than silently ignored. Relative paths are
# relative to the Daemon's working directory.

# The least severe log event emitted: "error", "warn", "info", "debug" or "trace".
# Optional; defaults to "info".
log_level = "info"

# How each log event is written: "text" (one human-readable line per event) or "json" (one JSON
# object per line, with the connection's Client ID and each request's id as JSON fields).
# Optional; defaults to "text". log_level filters both formats alike.
log_format = "text"

# How long a Session outlives its last Connection, in whole seconds, at least 1.
# Optional; defaults to 300.
session_ttl_secs = 300

# The most registered Scripts (CodeRegister) the AST Cache holds at once, across every Session:
# a count of entries, not bytes, a whole number, at least 1. Past it, the cache's policy evicts an
# entry (or declines the newest), and a Backend running an evicted handle is told to register it
# again. A Session's entries are also released when the Session ends.
# Optional; defaults to 10000.
ast_cache_capacity = 10000

# Transports. At least one [transport.*] section is required, and every field inside a
# section that is present is required unless marked optional.

# A Unix Domain Socket. Unix-only: on Windows this section is ignored with a warning (the Daemon
# still starts when another section is served there).
#
# The Daemon creates the socket file at startup and removes it on a clean shutdown. A socket file
# left behind by an unclean shutdown (nothing listening on it) is removed and replaced. Anything
# else at the path — a socket another process is listening on, a regular file, a directory — is
# never deleted: the Daemon refuses to start and names the path. The parent directory must
# already exist.
[transport.uds]
path = "/run/hexput/hexput.sock"
# The socket file's permission bits, as a string of three or four octal digits, at most "0777".
# Connecting needs write permission on the socket, so "0660" admits the Daemon's user and group.
# The mode is in place before any Backend can connect. Optional; without it the Daemon's umask
# decides.
mode = "0660"

# TCP. Always TLS — there is no plaintext option: every connection completes a TLS handshake
# (TLS 1.2 or 1.3) before a single Hexput frame is read, so both the certificate and the key are
# required. `bind` is an IP address with an optional port: "0.0.0.0", "::" or "[::1]" listen on
# the default port 7476, "0.0.0.0:7400" on the port given. The Daemon reads both PEM files at
# startup and refuses to start, naming the file, when either is missing, unreadable or malformed,
# or when the key does not match the certificate. `tls_cert` holds the certificate chain, leaf
# first; `tls_key` the leaf's private key (PKCS#8, PKCS#1 or SEC1). Restart the Daemon to load a
# renewed certificate.
[transport.tcp]
bind = "0.0.0.0"
tls_cert = "/etc/hexput/tls/cert.pem"
tls_key = "/etc/hexput/tls/key.pem"

# WebSocket, for Backends behind HTTP-only proxies and gateways. It always uses TLS, exactly as
# TCP does: there is no `ws://` mode, so `tls_cert` and `tls_key` are both required. Every
# connection completes the TLS handshake before its WebSocket upgrade, and each binary message
# carries one request or reply. `bind` is an IP address with an optional port: "0.0.0.0", "::"
# or "[::1]" listen on the default port 7478, "0.0.0.0:7400" on the port given. The certificate
# and key may be the same files as TCP's; they are loaded and checked the same way.
[transport.websocket]
bind = "0.0.0.0"
tls_cert = "/etc/hexput/tls/cert.pem"
tls_key = "/etc/hexput/tls/key.pem"

# A Windows Named Pipe, the Windows-native local transport. Windows-only: on any other platform
# this section is ignored with a warning (the Daemon still starts when another section is served
# there), but it is always validated. `path` is `\\.\pipe\` followed by a non-empty name with no
# further `\`, at most 256 characters in all; write it as a TOML literal string (single quotes)
# so the backslashes stay as written. The pipe accepts local clients only, so it needs no TLS. It
# uses Windows' default security descriptor: only the Daemon's own account and administrators can
# open it read/write. The Daemon refuses to start, naming the pipe, when another process already
# serves that name. A client that finds every instance busy (ERROR_PIPE_BUSY) retries.
[transport.named_pipe]
path = '\\.\pipe\hexput'
