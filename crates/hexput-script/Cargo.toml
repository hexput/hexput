[package]
name = "hexput-script"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]

# `hexput-port` for the `ExecutionStart` payload, the wire value and the `ErrorBody` this crate
# owns (Spine amendment 2026-09-23, Story 2.6). `scripts/check-crate-graph.py` pins this set.
[dependencies]
hexput-port = { path = "../hexput-port" }
hexput-parser = { path = "../hexput-parser" }
hexput-interpreter = { path = "../hexput-interpreter" }
hexput-check = { path = "../hexput-check" }
hexput-exec = { path = "../hexput-exec" }
# External: decoding, parsing and converting the result run on the blocking pool (Story 3.1).
tokio = { workspace = true }

[lints]
workspace = true
