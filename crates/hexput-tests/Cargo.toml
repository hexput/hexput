[package]
name = "hexput-tests"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]

# Every crate under test is a DEV-dependency, never a normal one. That distinction is load-bearing:
# `scripts/check-crate-graph.py` enforces the Spine's AD edges over normal dependencies only, so a
# test crate may reach `hexput-enforce` (AD-3) or `hexput-transport` (AD-1) without weakening rules
# that are about what production code can reach. A normal dependency here would — correctly — fail
# the graph check.
#
# Add each crate to this list as it gains code worth testing.
[dev-dependencies]
hexput-shared = { path = "../hexput-shared" }
hexput-lexer = { path = "../hexput-lexer" }
hexput-ast = { path = "../hexput-ast" }
hexput-parser = { path = "../hexput-parser" }
hexput-interpreter = { path = "../hexput-interpreter" }
hexput-check = { path = "../hexput-check" }
hexput-cli-core = { path = "../hexput-cli-core" }
hexput-config = { path = "../hexput-config" }
hexput-daemon = { path = "../hexput-daemon" }
hexput-port = { path = "../hexput-port" }
hexput-transport = { path = "../hexput-transport" }
hexput-connection = { path = "../hexput-connection" }
hexput-session = { path = "../hexput-session" }
hexput-exec = { path = "../hexput-exec" }
hexput-script = { path = "../hexput-script" }
# Third-party, for building and inspecting raw MessagePack in the wire tests.
rmp-serde = { workspace = true }
rmpv = { workspace = true }
serde = { workspace = true }
# Story 2.8: the daemon's JSON log lines are parsed and asserted field by field; the connection
# tests install the same kind of subscriber around `serve` to observe its spans directly.
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Story 2.3: the Port's halves are async; the adapter and connection tests run them on tokio.
tokio = { workspace = true }

[lints]
workspace = true
