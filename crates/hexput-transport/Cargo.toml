[package]
name = "hexput-transport"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]

# `hexput-port` is the only workspace crate this may reach (asserted by
# `scripts/check-crate-graph.py`): an adapter turns bytes into the Port's envelopes and knows
# nothing of Sessions or execution (AD-1).
[dependencies]
hexput-port = { path = "../hexput-port" }
tokio = { workspace = true }
# Story 5.1: the TCP+TLS adapter (`tcp_tls`). External crates, no workspace edge.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# Story 5.2: the WebSocket adapter (`websocket`), over the same TLS. External crates, no edge.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
